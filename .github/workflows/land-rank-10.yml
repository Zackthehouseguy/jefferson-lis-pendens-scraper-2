name: Land Rank 10 Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/land-rank-10.yml'
      - 'reports/land_private_live/ai_classifications.json'
      - 'scrapers/probe/land_rank_acceptance.py'
      - 'scrapers/land_decision_layer.py'
      - 'scrapers/land_filters.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scrapers.probe.land_rank_acceptance --root reports/land_private_live --target 10
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/land_private_live/ranked_report.json reports/land_private_live/ranked_report.md || true
          git diff --cached --quiet || git commit -m "Update private land10 ranking [skip ci]"
          git push origin HEAD:main || true
# trigger
