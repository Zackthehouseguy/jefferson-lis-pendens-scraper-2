name: Allocate Agent Leads

on:
  push:
    branches: [main]
    paths:
      - 'triggers/agent_requests/*.json'
  workflow_dispatch:
    inputs:
      agent_id:
        description: Agent ID from config/agent_roster.json
        required: true
        type: string
      houses_file:
        description: Ranked/qualified SFR JSON pool
        required: true
        type: string
      land_file:
        description: Ranked/qualified land JSON pool
        required: true
        type: string
      house_limit:
        required: false
        default: '25'
        type: string
      land_limit:
        required: false
        default: '25'
        type: string

permissions:
  contents: write

# Critical: all agents share one lock. A second allocation waits for the first
# to commit state/lead_assignments.json before choosing leads.
concurrency:
  group: reaper-global-lead-allocation
  cancel-in-progress: false

jobs:
  allocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install market verification dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Resolve request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "agent_id=${{ inputs.agent_id }}" >> "$GITHUB_OUTPUT"
            echo "houses_file=${{ inputs.houses_file }}" >> "$GITHUB_OUTPUT"
            echo "land_file=${{ inputs.land_file }}" >> "$GITHUB_OUTPUT"
            echo "house_limit=${{ inputs.house_limit }}" >> "$GITHUB_OUTPUT"
            echo "land_limit=${{ inputs.land_limit }}" >> "$GITHUB_OUTPUT"
          else
            REQUEST_FILE=$(git show --pretty='' --name-only "$GITHUB_SHA" | grep '^triggers/agent_requests/.*\.json$' | head -1)
            if [ -z "$REQUEST_FILE" ]; then
              echo 'No agent request file found in triggering commit.' >&2
              exit 2
            fi
            echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
            python - "$REQUEST_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          p,out=sys.argv[1:]
          d=json.load(open(p,encoding='utf-8'))
          required=('agent_id','houses_file','land_file')
          missing=[k for k in required if not d.get(k)]
          if missing: raise SystemExit('Missing request fields: '+','.join(missing))
          with open(out,'a',encoding='utf-8') as f:
              f.write(f"agent_id={d['agent_id']}\n")
              f.write(f"houses_file={d['houses_file']}\n")
              f.write(f"land_file={d['land_file']}\n")
              f.write(f"house_limit={int(d.get('house_limit',25))}\n")
              f.write(f"land_limit={int(d.get('land_limit',25))}\n")
          PY
          fi

      - name: Sync latest shared ledger
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Validate agent is active
        env:
          AGENT_ID: ${{ steps.request.outputs.agent_id }}
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('config/agent_roster.json',encoding='utf-8'))
          aid=os.environ['AGENT_ID']
          matches=[a for a in d.get('agents',[]) if a.get('agent_id')==aid and a.get('active') is True]
          if not matches: raise SystemExit(f'Agent is not active in roster: {aid}')
          PY

      - name: Allocate unique sticky leads
        env:
          AGENT_ID: ${{ steps.request.outputs.agent_id }}
          HOUSES_FILE: ${{ steps.request.outputs.houses_file }}
          LAND_FILE: ${{ steps.request.outputs.land_file }}
          HOUSE_LIMIT: ${{ steps.request.outputs.house_limit }}
          LAND_LIMIT: ${{ steps.request.outputs.land_limit }}
        run: |
          OUT="reports/agent_batches/${AGENT_ID}/latest.json"
          python -m scrapers.agent_allocator \
            --agent-id "$AGENT_ID" \
            --houses-file "$HOUSES_FILE" \
            --land-file "$LAND_FILE" \
            --house-limit "$HOUSE_LIMIT" \
            --land-limit "$LAND_LIMIT" \
            --state-file state/lead_assignments.json \
            --output "$OUT"

      - name: Verify current public market status
        env:
          AGENT_ID: ${{ steps.request.outputs.agent_id }}
        run: |
          OUT="reports/agent_batches/${AGENT_ID}/latest.json"
          python -m scrapers.market_verifier --input "$OUT"
          python -m scrapers.probe.render_lead_cards \
            --input "$OUT" \
            --output "reports/agent_batches/${AGENT_ID}/latest.md" \
            --kind mixed

      - name: Build CRM ingest payload
        id: crm_payload
        env:
          AGENT_ID: ${{ steps.request.outputs.agent_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          agent = os.environ['AGENT_ID']
          src = pathlib.Path(f'reports/agent_batches/{agent}/latest.json')
          out = pathlib.Path(f'reports/agent_batches/{agent}/crm_ingest_payload.json')
          d = json.loads(src.read_text(encoding='utf-8'))

          def first(x, *names):
              for n in names:
                  v = x.get(n)
                  if v is not None and v != '':
                      return v
              return None

          def canonical(x, lane):
              owner = first(x, 'verified_owner', 'pva_owner', 'owner_name', 'full_owner_name')
              pva_verified = bool(first(x, 'pva_verified'))
              return {
                  **x,
                  'name': first(x, 'name', 'owner_name', 'pva_owner', 'verified_owner') or owner,
                  'address': first(x, 'address', 'property_address', 'source_property_address'),
                  'reaper_agent_id': first(x, 'reaper_agent_id', 'agent_id') or agent,
                  'reaper_assignment': first(x, 'reaper_assignment', 'assignment_status'),
                  'reaper_rank': first(x, 'reaper_rank', 'rank'),
                  'lead_lane': lane,
                  'overall_priority_score': first(x, 'overall_priority_score', 'priority_score', 'reaper_priority_score'),
                  'ai_classification': first(x, 'ai_classification', 'ai_distress_level', 'ai_motivation_level'),
                  'distress_score': first(x, 'distress_score'),
                  'motivation_score': first(x, 'motivation_score'),
                  'builder_fit_score': first(x, 'builder_fit_score'),
                  'saturation_risk': first(x, 'saturation_risk', 'saturation_score'),
                  'freshness_score': first(x, 'freshness_score'),
                  'verified_owner': owner,
                  'ownership_confidence': first(x, 'ownership_confidence') or ('PVA VERIFIED' if pva_verified and owner else None),
                  'owner_mailing': first(x, 'owner_mailing', 'owner_mailing_address', 'pva_mailing_address'),
                  'parcel_id': first(x, 'parcel_id', 'source_parcel_id', 'pva_parcel_id'),
                  'occupancy_status': first(x, 'occupancy_status', 'occupancy'),
                  'occupancy_source': first(x, 'occupancy_source') or ('TheReaper source stack' if first(x, 'occupancy_status', 'occupancy') else None),
                  'reaper_property_key': first(x, 'reaper_property_key', 'property_key'),
                  'reaper_material_revision': first(x, 'reaper_material_revision', 'material_revision', 'event_fingerprint'),
              }

          leads=[]
          withheld=[]
          for lane_key, lane_name in (('houses','house'),('land','land')):
              for x in d.get(lane_key, []) or []:
                  c = canonical(x, lane_name)
                  # Hard stop: never auto-import anything that has not already
                  # been independently cleared as currently off-market.
                  if c.get('market_status') != 'OFF-MARKET VERIFIED' or not c.get('market_status_checked_at'):
                      withheld.append({
                          'property_key': c.get('reaper_property_key'),
                          'parcel_id': c.get('parcel_id'),
                          'address': c.get('address'),
                          'reason': c.get('market_status') or 'MARKET STATUS UNVERIFIED'
                      })
                      continue
                  leads.append(c)

          payload={
              'source': 'thereaper',
              'run_id': f"{d.get('generated_at') or d.get('batch_id') or 'unknown'}::{agent}",
              'agent_id': agent,
              'leads': leads,
              'withheld_before_crm': withheld,
          }
          out.write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(f'Prepared {len(leads)} callable leads for CRM; withheld {len(withheld)} without OFF-MARKET VERIFIED.')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"callable_count={len(leads)}\n")
              f.write(f"payload_path={out}\n")
          PY

      - name: Persist assignment atomically
        env:
          AGENT_ID: ${{ steps.request.outputs.agent_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/lead_assignments.json "reports/agent_batches/${AGENT_ID}/latest.json" "reports/agent_batches/${AGENT_ID}/latest.md"
          git diff --cached --quiet || git commit -m "Allocate Reaper leads to ${AGENT_ID} [skip ci]"
          git push origin HEAD:main

      - name: Import callable Reaper leads into Zack CRM
        if: ${{ steps.crm_payload.outputs.callable_count != '0' }}
        env:
          REAPER_CRM_INGEST_TOKEN: ${{ secrets.REAPER_CRM_INGEST_TOKEN }}
          PAYLOAD_PATH: ${{ steps.crm_payload.outputs.payload_path }}
          CRM_INGEST_URL: https://real-track-app.lovable.app/api/public/reaper/ingest
        run: |
          if [ -z "$REAPER_CRM_INGEST_TOKEN" ]; then
            echo 'REAPER_CRM_INGEST_TOKEN is not configured in GitHub Actions secrets.' >&2
            exit 1
          fi

          RESPONSE=$(mktemp)
          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            --request POST "$CRM_INGEST_URL" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $REAPER_CRM_INGEST_TOKEN" \
            --data-binary "@$PAYLOAD_PATH")

          cat "$RESPONSE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "CRM ingest failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi

          python - "$RESPONSE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if not d.get('ok'):
              raise SystemExit('CRM response did not report ok=true')
          print('CRM ingest summary:', json.dumps({
              'received': d.get('received'),
              'accepted': d.get('accepted'),
              'rejected': d.get('rejected'),
              'duplicates': d.get('duplicates'),
              'reactivated': d.get('reactivated'),
              'batch_id': d.get('batch_id'),
          }))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: reaper-agent-batch-${{ steps.request.outputs.agent_id }}
          path: reports/agent_batches/${{ steps.request.outputs.agent_id }}/
          retention-days: 14
