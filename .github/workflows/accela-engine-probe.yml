name: Accela Engine Probe

# Bench-test workflow only; no production ingest.
on:
  push:
    branches:
      - main
    paths:
      - "scrapers/probe/accela_engine_probe_v3.py"
      - ".github/workflows/accela-engine-probe.yml"
  workflow_dispatch:
    inputs:
      target_open:
        description: "Number of open parent Accela cases to prove"
        required: false
        default: "5"
      max_parent_attempts:
        description: "Maximum parent cases to render"
        required: false
        default: "15"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Mark workflow startup
        run: |
          mkdir -p reports/accela_engine_v3
          printf 'started_utc=%s\nrun_id=%s\nsha=%s\n' "$(date -u +%FT%TZ)" "${{ github.run_id }}" "${{ github.sha }}" > reports/accela_engine_v3/workflow_started.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/accela_engine_v3/workflow_started.txt
          git commit -m "Mark Accela v3 probe workflow start [skip ci]"
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run corrected parent-case probe
        env:
          TARGET_OPEN: ${{ github.event.inputs.target_open || '5' }}
          MAX_PARENT_ATTEMPTS: ${{ github.event.inputs.max_parent_attempts || '15' }}
        run: |
          python -m scrapers.probe.accela_engine_probe_v3 \
            --target-open "$TARGET_OPEN" \
            --max-parent-attempts "$MAX_PARENT_ATTEMPTS" \
            --out reports/accela_engine_v3

      - name: Print readable report
        if: always()
        run: |
          echo "===== ACCELA ENGINE V3 REPORT ====="
          cat reports/accela_engine_v3/report.md 2>/dev/null || true

      - name: Persist report to main
        if: always()
        run: |
          if [ -f reports/accela_engine_v3/report.json ]; then
            git add reports/accela_engine_v3/report.json reports/accela_engine_v3/report.md
            git diff --cached --quiet || git commit -m "Update Accela engine v3 report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload probe report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accela-engine-probe-v3-report
          path: reports/accela_engine_v3/**
          if-no-files-found: warn
          retention-days: 14
