name: Accela Engine Probe

on:
  push:
    branches:
      - main
      - accela-engine-probe
    paths:
      - "scrapers/probe/accela_engine_probe.py"
      - ".github/workflows/accela-engine-probe.yml"
  workflow_dispatch:
    inputs:
      target_open:
        description: "Number of open Accela records to prove"
        required: false
        default: "5"
      max_candidates:
        description: "Maximum recent candidates to attempt"
        required: false
        default: "35"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run isolated Accela Chromium probe
        env:
          TARGET_OPEN: ${{ github.event.inputs.target_open || '5' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '35' }}
        run: |
          python scrapers/probe/accela_engine_probe.py \
            --target-open "$TARGET_OPEN" \
            --max-candidates "$MAX_CANDIDATES" \
            --out reports/accela_engine

      - name: Print readable report
        if: always()
        run: |
          echo "===== ACCELA ENGINE REPORT ====="
          cat reports/accela_engine/report.md 2>/dev/null || true

      - name: Persist report to triggering branch
        if: always()
        run: |
          if [ -f reports/accela_engine/report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/accela_engine/report.json reports/accela_engine/report.md
            git diff --cached --quiet || git commit -m "Update Accela engine probe report [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload probe report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accela-engine-probe-report
          path: reports/accela_engine/**
          if-no-files-found: warn
          retention-days: 14
