name: Prior SFR Fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prior-sfr-fallback.yml'
      - 'scrapers/probe/prior_sfr_fallback.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m scrapers.probe.prior_sfr_fallback
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/sfr_prior_fallback/report.json
          git diff --cached --quiet || git commit -m "Update prior SFR fallback [skip ci]"
          git push origin HEAD:main || true
