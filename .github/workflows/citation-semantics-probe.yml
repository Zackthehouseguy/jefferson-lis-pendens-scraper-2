name: Citation Semantics Probe

on:
  push:
    branches: [main]
    paths:
      - "scrapers/probe/citation_semantics_probe.py"
      - ".github/workflows/citation-semantics-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark startup
        run: |
          mkdir -p reports/citation_semantics
          printf 'started_utc=%s\nrun_id=%s\nsha=%s\n' "$(date -u +%FT%TZ)" "${{ github.run_id }}" "${{ github.sha }}" > reports/citation_semantics/workflow_started.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/citation_semantics/workflow_started.txt
          git commit -m "Mark citation acceptance start [skip ci]"
          git push origin HEAD:main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run citation semantics probe
        run: python -m scrapers.probe.citation_semantics_probe
      - name: Persist report
        if: always()
        run: |
          git pull --rebase origin main
          git add reports/citation_semantics/report.json reports/citation_semantics/report.md
          git diff --cached --quiet || git commit -m "Update citation semantics report [skip ci]"
          git push origin HEAD:main
