name: Land Private 10 Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/land-private-10.yml'
      - 'scrapers/probe/land_private_extract.py'
      - 'scrapers/land_filters.py'
      - 'scrapers/probe/land_live_extract.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  land10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - run: python -m scrapers.probe.land_private_extract --target 10 --raw-extra 5 --pm-limit 5000 --max-attempts 120 --out reports/land_private_live
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/land_private_live/ || true
          git diff --cached --quiet || git commit -m "Update private land10 acceptance [skip ci]"
          git push origin HEAD:main || true
# trigger
