name: Prepare Land Stress50 AI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-land-stress50.yml'
      - 'scrapers/probe/prepare_land_stress50_ai.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scrapers.probe.prepare_land_stress50_ai
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/land_stress_50/ai_input*.json reports/land_stress_50/ai_input.md || true
          git diff --cached --quiet || git commit -m "Update land stress50 AI packet [skip ci]"
          git push origin HEAD:main || true
# trigger-2
