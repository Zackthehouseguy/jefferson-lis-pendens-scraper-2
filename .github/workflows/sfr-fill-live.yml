name: Fresh SFR Fill
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sfr-fill-live.yml'
      - 'scrapers/probe/sfr_fill_extract.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - run: python -m scrapers.probe.sfr_fill_extract
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/sfr_fill_live/ || true
          git diff --cached --quiet || git commit -m "Update fresh SFR fill extract [skip ci]"
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfr-fill-live
          path: reports/sfr_fill_live/
          retention-days: 14
