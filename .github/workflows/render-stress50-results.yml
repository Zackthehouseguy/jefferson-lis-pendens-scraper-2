name: Render Stress50 Results
on:
  push:
    branches: [main]
    paths:
      - 'scrapers/probe/render_stress50_results.py'
      - '.github/workflows/render-stress50-results.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scrapers.probe.render_stress50_results
      - name: Persist result sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/stress_50_live/results_compact.md
          git diff --cached --quiet || git commit -m "Render compact 50-record results [skip ci]"
          git push origin HEAD:main
