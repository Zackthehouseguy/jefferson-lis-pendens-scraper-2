name: Land Stress 50
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/land-stress-50.yml'
      - 'scrapers/probe/land_stress_50_extract.py'
      - 'scrapers/lojic_land.py'
      - 'scrapers/land_filters.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - run: python -m scrapers.probe.land_stress_50_extract --target 50 --raw-target 85 --pm-limit 12000 --max-attempts 500
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/land_stress_50/ || true
          git diff --cached --quiet || git commit -m "Update land stress50 extraction [skip ci]"
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: land-stress-50
          path: reports/land_stress_50/
          retention-days: 14
