name: Reaper Zack Delivery

on:
  workflow_run:
    workflows: ["Reaper Multi-Source Live"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'triggers/reaper_zack/*.json'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: reaper-global-lead-allocation
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Sync latest shared state
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp state/lead_assignments.json /tmp/lead_assignments_before.json

      - name: Require a healthy, fresh production pool
        run: |
          python -m scrapers.probe.reaper_health_check \
            --report reports/reaper_multi_source_live/bulk_qualified.json \
            --source-exit-codes reports/reaper_multi_source_live/source_exit_codes.txt \
            --out reports/agent_batches/zack/source_health.json \
            --max-age-hours 24 \
            --require-live-ai

      - name: Allocate through shared sticky allocator
        run: |
          mkdir -p reports/agent_batches/zack
          python -m scrapers.agent_allocator \
            --agent-id zack \
            --houses-file reports/reaper_multi_source_live/bulk_qualified.json \
            --land-file reports/reaper_multi_source_live/bulk_qualified.json \
            --house-limit 25 \
            --land-limit 25 \
            --state-file state/lead_assignments.json \
            --output reports/agent_batches/zack/latest.json

      - name: Exclude public and Landbank ownership only
        run: |
          python - <<'PY'
          import json, pathlib

          batch_p = pathlib.Path('reports/agent_batches/zack/latest.json')
          state_p = pathlib.Path('state/lead_assignments.json')
          before = json.load(open('/tmp/lead_assignments_before.json', encoding='utf-8'))
          state = json.load(open(state_p, encoding='utf-8'))
          batch = json.load(open(batch_p, encoding='utf-8'))

          def key(x):
              return (
                  x.get('reaper_property_key')
                  or x.get('property_key')
                  or (f"JEFFERSON_KY::PARCEL::{x.get('parcel_id')}" if x.get('parcel_id') else None)
              )

          def public_owned(x):
              owner_values = []
              for n in ('pva_owner', 'verified_owner', 'owner_name', 'full_owner_name', 'name'):
                  if x.get(n):
                      owner_values.append(str(x.get(n)).upper())
              owner = ' | '.join(owner_values)
              terms = (
                  'LANDBANK', 'LAND BANK', 'LAND BANK AUTHORITY',
                  'LOUISVILLE METRO GOVERNMENT', 'LOUISVILLE/JEFFERSON COUNTY METRO GOVERNMENT',
                  'JEFFERSON COUNTY METRO GOVERNMENT', 'METRO GOVERNMENT',
                  'HOUSING AUTHORITY', 'LOUISVILLE METRO',
                  'LOUISVILLE METRO LANDBANK AUTHORITY', 'LOUISVILLE LAND BANK AUTHORITY',
                  'LOUISVILLE/JEFFERSON COUNTY LANDBANK AUTHORITY',
                  'JEFFERSON COUNTY GOVERNMENT', 'COMMONWEALTH OF KENTUCKY',
                  'UNITED STATES OF AMERICA', 'SECRETARY OF HOUSING',
                  'DEPARTMENT OF HOUSING AND URBAN DEVELOPMENT',
              )
              return any(t in owner for t in terms)

          delivered = []
          withheld = []
          for lane in ('houses', 'land'):
              out = []
              for x in batch.get(lane, []) or []:
                  if not public_owned(x):
                      out.append(x)
                      delivered.append(x)
                      continue

                  k = key(x)
                  withheld.append({
                      'property_key': k,
                      'address': x.get('property_address') or x.get('address'),
                      'owner': x.get('pva_owner') or x.get('verified_owner') or x.get('owner_name'),
                      'reason': 'public/landbank owner',
                  })
                  if k:
                      if k in (before.get('properties') or {}):
                          state.setdefault('properties', {})[k] = before['properties'][k]
                      else:
                          state.setdefault('properties', {}).pop(k, None)
              batch[lane] = out

          batch['delivery_summary'] = {
              'delivered': len(delivered),
              'withheld': len(withheld),
              'withheld_candidates': withheld,
              'rule': 'Market status is not a delivery gate. Only public/Landbank ownership is withheld after shared allocation.',
          }
          state_p.write_text(json.dumps(state, indent=2), encoding='utf-8')
          batch_p.write_text(json.dumps(batch, indent=2), encoding='utf-8')
          print(json.dumps(batch['delivery_summary'], indent=2))
          PY

      - name: Render frozen lead cards
        run: python -m scrapers.probe.render_lead_cards --input reports/agent_batches/zack/latest.json --output reports/agent_batches/zack/latest.md --kind mixed

      - name: Build CRM payload
        id: crm
        run: |
          python - <<'PY'
          import json, pathlib, os
          from scrapers.owner_name import format_owner_name
          d = json.load(open('reports/agent_batches/zack/latest.json', encoding='utf-8'))

          def first(x, *names):
              for n in names:
                  v = x.get(n)
                  if v is not None and v != '':
                      return v
              return None

          SOURCE_FAMILIES = {
              'lis_pendens': 'lis_pendens',
              'jefferson_lis_pendens': 'lis_pendens',
              'pre_foreclosure': 'pre_foreclosure',
              'tax_delinquent': 'tax_delinquent',
              'tax_delinquency': 'tax_delinquent',
              'jefferson_tax_delinquent': 'tax_delinquent',
              'louisville_code_violations': 'code_enforcement',
              'code_enforcement': 'code_enforcement',
              'property_maintenance': 'code_enforcement',
              'wills': 'probate',
              'probate': 'probate',
              'wills_probate': 'probate',
          }
          FAMILY_LABELS = {
              'lis_pendens': 'Lis Pendens',
              'pre_foreclosure': 'Pre-Foreclosure',
              'tax_delinquent': 'Tax Delinquent',
              'code_enforcement': 'Code Enforcement',
              'probate': 'Probate / Inherited',
          }
          FAMILY_GROUPS = {
              'lis_pendens': 'legal',
              'pre_foreclosure': 'legal',
              'tax_delinquent': 'tax',
              'code_enforcement': 'code',
              'probate': 'probate',
          }
          FAMILY_ORDER = ('pre_foreclosure', 'lis_pendens', 'tax_delinquent', 'probate', 'code_enforcement')

          def distress_classification(x):
              raw = []
              for value in (x.get('sources') or []):
                  key = str(value).strip().lower()
                  if key and key not in raw:
                      raw.append(key)
              for ev in (x.get('evidence') or []):
                  key = str((ev or {}).get('source') or '').strip().lower()
                  if key and key not in raw:
                      raw.append(key)
              families = []
              for family in FAMILY_ORDER:
                  if any(SOURCE_FAMILIES.get(key) == family for key in raw):
                      families.append(family)
              labels = [FAMILY_LABELS[f] for f in families]
              groups = list(dict.fromkeys(FAMILY_GROUPS[f] for f in families))
              stacked = len(groups) >= 2
              if stacked:
                  display = 'Stacked: ' + ' + '.join(labels)
                  category = 'Stacked'
              elif labels:
                  display = labels[0]
                  category = labels[0]
              else:
                  display = 'Unknown Distress Signal'
                  category = 'Unknown'
              return raw, families, groups, labels, stacked, category, display

          leads = []
          for lk, ln in (('houses', 'house'), ('land', 'land')):
              for x in d.get(lk, []) or []:
                  owner = first(x, 'verified_owner', 'pva_owner', 'owner_name', 'full_owner_name')
                  formatted_owner = format_owner_name(owner)
                  raw_sources, signal_families, signal_groups, signal_labels, signal_stacked, signal_category, signal_display = distress_classification(x)
                  y = {
                      **x,
                      'sources': raw_sources,
                      'distress_signal_type': signal_category,
                      'distress_signal_types': signal_labels,
                      'distress_signal': signal_display,
                      'distress_categories': signal_labels,
                      'distress_source_families': signal_families,
                      'distress_groups': signal_groups,
                      'distress_primary': signal_category,
                      'distress_stacked': signal_stacked,
                      'tags': signal_labels,
                      'owner_name_raw': owner,
                      'owner_name_display': formatted_owner['display'],
                      'owner_name_is_entity': formatted_owner['is_entity'],
                      'owner_name_ambiguous': formatted_owner['ambiguous'],
                      'owner_name_review_needed': formatted_owner['review_needed'],
                      'owner_name_provenance': 'pva_verified',
                      'owner_name_order': 'natural' if formatted_owner['changed'] else 'source',
                      'normalizer_version': 2,
                      'lead_source': signal_display,
                      'source_type': signal_category,
                      'motivation': signal_display,
                      'name': formatted_owner['display'] or owner,
                      'address': first(x, 'address', 'property_address', 'source_property_address'),
                      'reaper_agent_id': 'zack',
                      'lead_lane': ln,
                      'overall_priority_score': first(x, 'overall_priority_score', 'priority_score', 'reaper_priority_score'),
                      'ai_classification': first(x, 'ai_classification', 'ai_distress_level', 'ai_motivation_level'),
                      'distress_score': first(x, 'distress_score'),
                      'motivation_score': first(x, 'motivation_score'),
                      'builder_fit_score': first(x, 'builder_fit_score'),
                      'saturation_risk': first(x, 'saturation_risk', 'saturation_score'),
                      'freshness_score': first(x, 'freshness_score'),
                      'verified_owner': owner,
                      'ownership_confidence': first(x, 'ownership_confidence') or ('PVA VERIFIED' if x.get('pva_verified') and owner else None),
                      'owner_mailing': first(x, 'owner_mailing', 'owner_mailing_address', 'pva_mailing_address'),
                      'parcel_id': first(x, 'parcel_id', 'source_parcel_id', 'pva_parcel_id'),
                      'occupancy_status': first(x, 'occupancy_status', 'occupancy'),
                      'occupancy_source': first(x, 'occupancy_source') or ('TheReaper source stack' if first(x, 'occupancy_status', 'occupancy') else None),
                      'reaper_property_key': first(x, 'reaper_property_key', 'property_key'),
                      'reaper_material_revision': first(x, 'reaper_material_revision', 'material_revision', 'event_fingerprint'),
                  }
                  leads.append(y)

          payload = {
              'source': 'thereaper',
              'run_id': f"delivery::{d.get('generated_at') or 'current'}::zack",
              'agent_id': 'zack',
              'leads': leads,
          }
          pathlib.Path('reports/agent_batches/zack/crm_ingest_payload.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={len(leads)}\n")
          print(f'CRM leads={len(leads)}; market status not used as a delivery gate')
          PY

      - name: Import leads into Zack CRM
        if: ${{ steps.crm.outputs.count != '0' }}
        env:
          CRM_INGEST_URL: https://real-track-app.lovable.app/api/public/reaper/ingest
        run: |
          RESPONSE='reports/agent_batches/zack/crm_ingest_response.json'
          OIDC_RESPONSE=$(curl --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zacks-crm-reaper")
          OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")
          HTTP_CODE=$(curl --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 --output "$RESPONSE" --write-out '%{http_code}' --request POST "$CRM_INGEST_URL" --header 'Content-Type: application/json' --header "Authorization: Bearer $OIDC_TOKEN" --data-binary '@reports/agent_batches/zack/crm_ingest_payload.json')
          cat "$RESPONSE"; echo
          test "$HTTP_CODE" -ge 200 -a "$HTTP_CODE" -lt 300
          python - "$RESPONSE" reports/agent_batches/zack/crm_ingest_payload.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          payload = json.load(open(sys.argv[2], encoding='utf-8'))
          expected = len(payload.get('leads') or [])
          if not d.get('ok'):
              raise SystemExit('CRM response did not report ok=true')
          rejected = int(d.get('rejected') or 0)
          completed = int(d.get('accepted') or 0) + int(d.get('duplicates') or 0) + int(d.get('reactivated') or 0)
          if int(d.get('received') or -1) != expected:
              raise SystemExit(f'CRM received count mismatch: expected {expected}, got {d.get("received")}')
          if rejected:
              raise SystemExit(f'CRM rejected {rejected} lead(s)')
          if completed != expected:
              raise SystemExit(f'CRM acknowledgement mismatch: expected {expected}, completed {completed}')
          print('CRM ingest summary:', json.dumps(d))
          PY

      - name: Persist delivered batch and sticky ledger race-safely
        run: |
          STATE='state/lead_assignments.json'
          BATCH='reports/agent_batches/zack/latest.json'
          CARDS='reports/agent_batches/zack/latest.md'
          CRM='reports/agent_batches/zack/crm_ingest_payload.json'
          CRMRESP='reports/agent_batches/zack/crm_ingest_response.json'
          TMP="$(mktemp -d)"
          cp "$STATE" "$TMP/lead_assignments.json"
          cp "$BATCH" "$TMP/latest.json"
          cp "$CARDS" "$TMP/latest.md"
          cp "$CRM" "$TMP/crm_ingest_payload.json"
          if [ -f "$CRMRESP" ]; then cp "$CRMRESP" "$TMP/crm_ingest_response.json"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p state reports/agent_batches/zack
            cp "$TMP/lead_assignments.json" "$STATE"
            cp "$TMP/latest.json" "$BATCH"
            cp "$TMP/latest.md" "$CARDS"
            cp "$TMP/crm_ingest_payload.json" "$CRM"
            if [ -f "$TMP/crm_ingest_response.json" ]; then cp "$TMP/crm_ingest_response.json" "$CRMRESP"; fi
            git add "$STATE" "$BATCH" "$CARDS" "$CRM"
            if [ -f "$CRMRESP" ]; then git add "$CRMRESP"; fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Reaper delivery for zack [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reaper-zack-delivery
          path: reports/agent_batches/zack/
          retention-days: 14
