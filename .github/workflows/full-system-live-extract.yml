name: Full System Live Extract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-system-live-extract.yml"
      - "scrapers/probe/full_system_live_extract.py"
      - "scrapers/probe/full_system_fresh_individual.py"
      - "state/full_system_seen.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-system-live-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - name: Run fresh individual-owner live extraction
        run: |
          python -m scrapers.probe.full_system_fresh_individual \
            --target-individual 8 \
            --raw-target 20 \
            --arcgis-limit 1000 \
            --max-parent-attempts 60
      - name: Persist extraction report and seen state
        if: always()
        run: |
          REPORT="reports/full_system_live/extract_report.json"
          SEEN="state/full_system_seen.json"

          if [ ! -f "$REPORT" ]; then
            echo "No extraction report was generated; nothing to persist."
            exit 0
          fi

          TMPDIR_SAFE="$(mktemp -d)"
          cp "$REPORT" "$TMPDIR_SAFE/extract_report.json"
          if [ -f "$SEEN" ]; then
            cp "$SEEN" "$TMPDIR_SAFE/full_system_seen.json"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Persist attempt $attempt of 5"
            git fetch origin main
            git reset --hard origin/main

            mkdir -p "$(dirname "$REPORT")" "$(dirname "$SEEN")"
            cp "$TMPDIR_SAFE/extract_report.json" "$REPORT"
            if [ -f "$TMPDIR_SAFE/full_system_seen.json" ]; then
              cp "$TMPDIR_SAFE/full_system_seen.json" "$SEEN"
            fi

            git add "$REPORT" "$SEEN"

            if git diff --cached --quiet; then
              echo "Extraction report and seen state already match origin/main."
              exit 0
            fi

            git commit -m "Update fresh live extraction state [skip ci]"

            if git push origin HEAD:main; then
              echo "Fresh extraction state persisted successfully."
              exit 0
            fi

            echo "Push lost a race with another writer; retrying against latest main."
            sleep $((attempt * 2))
          done

          echo "Failed to persist fresh extraction state after 5 race-safe attempts."
          exit 1
      - name: Upload extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-live-extract
          path: |
            reports/full_system_live/
            state/full_system_seen.json
          if-no-files-found: error
          retention-days: 14

