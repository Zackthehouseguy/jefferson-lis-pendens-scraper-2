name: Summarize Land Stress
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summarize-land-stress.yml'
      - 'scrapers/probe/summarize_land_stress.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scrapers.probe.summarize_land_stress
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/land_stress_50/summary.json
          git diff --cached --quiet || git commit -m "Update land stress summary [skip ci]"
          git push origin HEAD:main || true
# trigger
