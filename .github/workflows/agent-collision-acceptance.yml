name: BENCH — Agent Collision Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'triggers/agent_collision_test.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reaper-lead-allocation
  cancel-in-progress: false

jobs:
  collision-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real-data collision acceptance
        run: python -m scrapers.probe.agent_collision_acceptance
      - name: Persist collision report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/agent_collision_acceptance/report.json || true
          git diff --cached --quiet || git commit -m "Update agent collision acceptance report [skip ci]"
          git push origin HEAD:main || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-collision-acceptance
          path: reports/agent_collision_acceptance/report.json
          retention-days: 14
