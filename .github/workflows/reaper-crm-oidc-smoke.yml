name: Reaper CRM OIDC Smoke

on:
  push:
    branches: [main]
    paths:
      - 'triggers/crm_smoke/*.json'

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          RESPONSE=$(curl --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zacks-crm-reaper")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify CRM ingest path
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CRM_INGEST_URL: https://real-track-app.lovable.app/api/public/reaper/ingest
        shell: bash
        run: |
          RESPONSE=$(mktemp)
          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            --request POST "$CRM_INGEST_URL" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --data "{\"source\":\"thereaper\",\"run_id\":\"smoke::${GITHUB_SHA}\",\"agent_id\":\"zack\",\"leads\":[]}")
          cat "$RESPONSE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "CRM smoke failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi
          python - "$RESPONSE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('ok') is not True:
              raise SystemExit('CRM response did not report ok=true')
          if d.get('received') != 0 or d.get('accepted') != 0:
              raise SystemExit('Unexpected smoke payload counts')
          print('CRM OIDC smoke succeeded')
          PY
