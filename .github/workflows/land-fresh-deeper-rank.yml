name: Rank Fresh Deeper Land
on:
  push:
    branches: [main]
    paths:
      - 'reports/land_fresh_deeper/ai_classifications.json'
      - 'scrapers/probe/land_fresh_deeper_rank.py'
      - '.github/workflows/land-fresh-deeper-rank.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scrapers.probe.land_fresh_deeper_rank
      - name: Persist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add reports/land_fresh_deeper/ranked_report.json || true
          git diff --cached --quiet || git commit -m "Update fresh deeper land ranking [skip ci]"
          git push origin HEAD:main || true
# waits-for-gpt-ai
