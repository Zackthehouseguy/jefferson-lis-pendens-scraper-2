name: Decision Layer Bench

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decision-layer-bench.yml"
      - "scrapers/decision_layer.py"
      - "scrapers/failure_recovery.py"
      - "scrapers/probe/decision_layer_bench.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run decision-layer acceptance bench
        run: python -m scrapers.probe.decision_layer_bench
      - name: Persist bench report
        if: always()
        run: |
          if [ -f reports/decision_layer_bench/report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/decision_layer_bench/report.json
            git diff --cached --quiet || git commit -m "Update decision layer bench report [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-layer-bench
          path: reports/decision_layer_bench/report.json
          if-no-files-found: error
          retention-days: 14
